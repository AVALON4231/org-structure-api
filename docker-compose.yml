version: '3.8'

services:
  db:
    image: postgres:14
    environment:
      POSTGRES_USER: user
      POSTGRES_PASSWORD: password
      POSTGRES_DB: org_structure
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data

  app:
    build: .
    ports:
      - "8000:8000"
    depends_on:
      - db
    environment:
      DATABASE_URL: postgresql://user:password@db:5432/org_structure
    command: >
      sh -c "echo 'Waiting for PostgreSQL...';
             while ! nc -z db 5432; do sleep 1; done;
             echo 'PostgreSQL started';
             alembic upgrade head;
             uvicorn app.main:app --host 0.0.0.0 --port 8000"

volumes:
  pgdata: