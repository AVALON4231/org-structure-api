[project]
name = "org-structure-api"
version = "1.0.0"
description = "Organizational Structure API"
requires-python = ">=3.10"
dependencies = [
    "fastapi>=0.103",
    "uvicorn[standard]>=0.23",
    "sqlalchemy>=2.0",
    "psycopg2-binary>=2.9",
    "alembic>=1.12",
    "pydantic>=1.10"
]

[project.optional-dependencies]
dev = [
    "pytest>=7.4",
    "httpx>=0.25"
]

[tool.setuptools]
packages = []